<svg width="1200" height="600" viewBox="0 0 1200 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Architecture produit de Winclow</title>
  <desc id="desc">Le joueur utilise l'application Winclow qui s'appuie sur des services de données, authentification et edge delivery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse"><stop stop-color="#080B18"/><stop offset=".48" stop-color="#121238"/><stop offset="1" stop-color="#0A1926"/></linearGradient>
    <linearGradient id="accent" x1="98" y1="80" x2="1100" y2="505" gradientUnits="userSpaceOnUse"><stop stop-color="#A855F7"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <filter id="shadow" x="-30%" y="-45%" width="160%" height="190%"><feDropShadow dx="0" dy="14" stdDeviation="17" flood-color="#00051A" flood-opacity=".55"/></filter>
  </defs>
  <rect width="1200" height="600" rx="28" fill="url(#bg)"/>
  <circle cx="160" cy="84" r="190" fill="#7C3AED" fill-opacity=".13"/><circle cx="1052" cy="510" r="240" fill="#0891B2" fill-opacity=".12"/>
  <text x="70" y="83" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="28" font-weight="700">WINCLOW · PRODUCT ARCHITECTURE</text>
  <text x="70" y="115" fill="#94A3B8" font-family="Arial, sans-serif" font-size="17">Discovery, intelligence prix et expérience joueur unifiées.</text>
  <path d="M300 298H392M808 298H900" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="M378 286L394 298L378 310M886 286L902 298L886 310" stroke="#60A5FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)">
    <rect x="70" y="205" width="230" height="185" rx="22" fill="#121A31" stroke="#C084FC" stroke-opacity=".6"/>
    <rect x="90" y="225" width="42" height="42" rx="12" fill="#7C3AED" fill-opacity=".27"/>
    <path d="M103 246h16M111 238v16" stroke="#E9D5FF" stroke-width="3" stroke-linecap="round"/>
    <text x="90" y="309" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="23" font-weight="700">JOUEUR</text>
    <text x="90" y="340" fill="#A8B5D1" font-family="Arial, sans-serif" font-size="15">Web · Mobile · Communauté</text>
    <text x="90" y="365" fill="#A8B5D1" font-family="Arial, sans-serif" font-size="15">Découvre · Compare · Suit</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="392" y="160" width="416" height="275" rx="24" fill="#131B37" stroke="url(#accent)" stroke-width="2"/>
    <rect x="416" y="185" width="74" height="34" rx="17" fill="#38BDF8" fill-opacity=".16"/>
    <text x="434" y="208" fill="#7DD3FC" font-family="Arial, sans-serif" font-size="14" font-weight="700">WINCLOW</text>
    <text x="416" y="261" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="27" font-weight="700">EXPÉRIENCE PRODUIT</text>
    <line x1="416" y1="283" x2="784" y2="283" stroke="#334155"/>
    <text x="416" y="320" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="17">Catalogue &amp; découverte</text>
    <text x="622" y="320" fill="#67E8F9" font-family="Arial, sans-serif" font-size="17">Price Intelligence</text>
    <text x="416" y="358" fill="#86EFAC" font-family="Arial, sans-serif" font-size="17">Alertes &amp; watchlists</text>
    <text x="622" y="358" fill="#F0ABFC" font-family="Arial, sans-serif" font-size="17">CrackAI &amp; communauté</text>
    <text x="416" y="404" fill="#94A3B8" font-family="Arial, sans-serif" font-size="14">Une interface claire pour transformer les données en décisions.</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="900" y="175" width="230" height="245" rx="22" fill="#101C2D" stroke="#34D399" stroke-opacity=".65"/>
    <rect x="920" y="195" width="42" height="42" rx="12" fill="#10B981" fill-opacity=".22"/>
    <path d="M931 216l8 8 13-15" stroke="#BBF7D0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="920" y="278" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="22" font-weight="700">SERVICES</text>
    <text x="920" y="312" fill="#A8B5D1" font-family="Arial, sans-serif" font-size="15">Auth &amp; rôles</text>
    <text x="920" y="340" fill="#A8B5D1" font-family="Arial, sans-serif" font-size="15">Données &amp; fonctions</text>
    <text x="920" y="368" fill="#A8B5D1" font-family="Arial, sans-serif" font-size="15">Edge &amp; livraison</text>
  </g>
  <text x="70" y="532" fill="#64748B" font-family="Arial, sans-serif" font-size="14">Architecture de haut niveau — les implémentations internes et configurations sensibles restent privées.</text>
</svg>
